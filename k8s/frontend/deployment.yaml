apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentra-frontend
  labels:
    app: sentra-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentra-frontend
  template:
    metadata:
      labels:
        app: sentra-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/aihpi/pilotproject-sentra/frontend:sha-65a23be
          ports:
            - containerPort: 80
          env:
            # Fully qualified, and it has to be. nginx resolves this one per
            # request through its own DNS client, which does not apply the
            # search list from /etc/resolv.conf -- so the bare `eval-harness`
            # that works under compose is NXDOMAIN here, and /api/eval answers
            # 502 with the harness running perfectly well beside it.
            - name: EVAL_HARNESS_HOST
              value: eval-harness.sentra.svc.cluster.local
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
