apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentra-registry
  labels:
    app: sentra-registry
spec:
  replicas: 1
  # One Postgres on one ReadWriteOnce volume. RollingUpdate would start the
  # replacement before the old pod let go of the disk and deadlock on the
  # multi-attach, which is #197 — and here it would also mean two postgres
  # processes over one data directory if they ever did land together.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sentra-registry
  template:
    metadata:
      labels:
        app: sentra-registry
    spec:
      containers:
        - name: postgres
          # Pinned to the same minor as docker-compose.yml, for the same reason
          # the qdrant pin exists: a rolling tag drifts on its own, and a
          # database that will not open its data directory is not a thing to
          # discover from a deploy.
          image: postgres:17.6-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: sentra
            - name: POSTGRES_DB
              value: sentra_registry
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentra-secret
                  key: REGISTRY_DB_PASSWORD
            # Not the mount point itself. A PVC arrives with a lost+found in
            # it, and initdb refuses a data directory that is not empty, so
            # postgres would crashloop on first start with a message about the
            # directory "existing but not being empty".
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: registry-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sentra", "-d", "sentra_registry"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "sentra", "-d", "sentra_registry"]
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "100m"
              memory: "256Mi"
      volumes:
        - name: registry-storage
          persistentVolumeClaim:
            claimName: sentra-registry-storage
