# Copy this file to secret.yaml and fill in real values:
#   cp example-secret.yaml secret.yaml
#
# Then apply:
#   kubectl apply -f secret.yaml -n sentra
#
# IMPORTANT: secret.yaml is gitignored — never commit real secrets!
#
# The cluster does not use this file. It reads sealed-secret.yaml, which is the
# same secret encrypted with the cluster's public key and is safe to commit.
# Adding a key here means nothing until the sealed secret is regenerated:
#
#   kubeseal --format yaml --namespace sentra < secret.yaml > sealed-secret.yaml
#
# That needs the cluster's cert, so it has to be done by someone with access.
apiVersion: v1
kind: Secret
metadata:
  name: sentra-secret
  namespace: sentra
type: Opaque
stringData:
  AI_HUB_API_KEY: "YOUR_AISC_API_KEY_HERE"

  # The document registry's database (#196). Two entries for one password: the
  # postgres pod is handed the password on its own to initialise itself, and
  # the backend is handed the whole URL because Settings takes a single DSN.
  # They have to agree, and the host is the sentra-db Service.
  REGISTRY_DB_PASSWORD: "YOUR_REGISTRY_DB_PASSWORD_HERE"
  REGISTRY_DATABASE_URL: "postgresql+psycopg://sentra:YOUR_REGISTRY_DB_PASSWORD_HERE@sentra-db:5432/sentra_registry"

  # The evaluation harness's database (#216). Its own, deliberately not the
  # registry's: the harness is a separate distribution, and sharing a server
  # would put SENTRA's ability to start in its hands.
  EVAL_DB_PASSWORD: "YOUR_EVAL_DB_PASSWORD_HERE"
  EVAL_DATABASE_URL: "postgresql+psycopg://sentra:YOUR_EVAL_DB_PASSWORD_HERE@eval-db:5432/sentra_eval"

  # JUDGE_API_KEY is deliberately absent. It is the same value as
  # AI_HUB_API_KEY today, so k8s/evaluation/ references that key rather than
  # duplicating a secret that would then have to be rotated twice. If the judge
  # ever moves to a different hub, it becomes its own entry here.

  # The login (#198). Not filled in on the cluster yet, and until they are
  # there is no way to log in and the write path stays open, which /api/health
  # reports. See backend/src/sentra/config.py for what empty means for each.
  #
  #   SESSION_SECRET  signs the session cookie. No default on purpose.
  #   SENTRA_USERS    name:role:hash, comma- or newline-separated. Roles are
  #                   leser, pruefer, admin. Produce a hash with
  #                   `cd backend && uv run python -m sentra.api.identity`.
  #   ADMIN_TOKEN     guards the write path and the personal-data read path.
  #
  # Note that a SESSION_SECRET alone is not enough to make login work: the
  # session cookie is Secure by default and there is no TLS in front of the
  # cluster yet. See #198 before setting these.
  #
  # SESSION_SECRET: "GENERATE_ME"
  # SENTRA_USERS: "name:role:hash"
  # ADMIN_TOKEN: "GENERATE_ME"
