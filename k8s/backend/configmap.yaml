apiVersion: v1
kind: ConfigMap
metadata:
  name: sentra-backend-config
data:
  # AI Model Hub
  AI_HUB_BASE_URL: "https://api.aisc.hpi.de/v1"
  EMBEDDING_MODEL: "octen-embedding-8b"
  CHAT_MODEL: "llama-3-3-70b"
  # Must match what EMBEDDING_MODEL actually returns. Spelled out rather than
  # left to the default because a silent mismatch here does not fail, it writes
  # a whole collection at the wrong width.
  EMBEDDING_DIM: "4096"
  EMBEDDING_TIMEOUT_SECONDS: "60"
  GENERATION_TIMEOUT_SECONDS: "120"

  # Qdrant (uses k8s service DNS name)
  QDRANT_URL: "http://qdrant:6333"
  COLLECTION_NAME: "bundestag_documents"
  DOC_COLLECTION_NAME: "bundestag_doc_summaries"

  # Ingestion
  DOCUMENTS_DIR: "/data/Ausarbeitungen"
  CHUNK_MAX_TOKENS: "2048"
  EMBEDDING_BATCH_SIZE: "32"

  # RAG
  RETRIEVAL_TOP_K: "10"

  # Feedback
  FEEDBACK_FILE: "/data/feedback.jsonl"

  # Not set on purpose:
  #
  # CORS_ORIGINS        nginx proxies /api from the same origin the page was
  #                     served from, so the browser never makes a cross-origin
  #                     request and nothing reads this.
  # REGISTRY_DATABASE_URL, SESSION_SECRET, SENTRA_USERS, ADMIN_TOKEN
  #                     secrets, or embed one. See k8s/secrets/ and #198.
  #
  # tests/test_k8s_configmap_matches_settings.py keeps this list honest.
