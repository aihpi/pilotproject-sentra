apiVersion: v1
kind: Service
metadata:
  name: eval-harness
  labels:
    app: sentra-eval-harness
spec:
  type: ClusterIP
  # The name nginx already proxies /api/eval to. frontend/nginx.conf.template
  # resolves it per request rather than at startup (#193), which is why the
  # frontend has been starting fine without this Service existing.
  selector:
    app: sentra-eval-harness
  ports:
    - name: http
      port: 8100
      targetPort: 8100
