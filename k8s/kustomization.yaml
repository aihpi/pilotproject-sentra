apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sentra

# sentra-secret is not listed here. The repo is public, so the secret is applied
# to the cluster by hand (#237); see k8s/secrets/example-secret.yaml.
resources:
  - namespace.yaml
  - storage/documents-pvc.yaml
  - registry/pvc.yaml
  - registry/deployment.yaml
  - registry/service.yaml
  - registry/migrate-job.yaml
  - qdrant/pvc.yaml
  - qdrant/deployment.yaml
  - qdrant/service.yaml
  - evaluation/pvc.yaml
  - evaluation/db-deployment.yaml
  - evaluation/db-service.yaml
  - evaluation/configmap.yaml
  - evaluation/migrate-job.yaml
  - evaluation/deployment.yaml
  - evaluation/service.yaml
  - backend/configmap.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
