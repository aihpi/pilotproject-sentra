apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentra-qdrant
  labels:
    app: sentra-qdrant
spec:
  replicas: 1
  # Single writer over a ReadWriteOnce volume, same as the backend. See
  # k8s/backend/deployment.yaml and #197.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sentra-qdrant
  template:
    metadata:
      labels:
        app: sentra-qdrant
    spec:
      containers:
        - name: qdrant
          # Was v1.13.6, six minors behind what development runs against.
          # See docker-compose.yml; this pin, that one and the qdrant-client
          # floor in backend/pyproject.toml all move together.
          #
          # FIRST DEPLOY AFTER THIS CHANGE: the qdrant-storage PVC may still
          # hold data written by 1.13.6, and Qdrant upgrades between adjacent
          # minors rather than across six, so 1.19 may refuse to open it. This
          # is a prototype and the corpus is re-ingestable, so the accepted
          # answer is to discard the volume and re-ingest rather than migrate:
          #
          #   kubectl delete pvc qdrant-storage -n sentra
          #   ./deploy.sh
          #
          # If the pod comes up healthy without that, nothing was lost and
          # there is nothing to do.
          image: qdrant/qdrant:v1.19.1
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
          readinessProbe:
            httpGet:
              path: /healthz
              port: 6333
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 6333
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"
            requests:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: qdrant-storage
          persistentVolumeClaim:
            claimName: qdrant-storage
