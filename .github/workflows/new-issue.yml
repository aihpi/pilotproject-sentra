# The two things an issue form cannot do for itself.
#
# Type and labels are set in the templates, where they sit next to the fields
# they describe. These two cannot be:
#
#   assignee   `assignees:` in a template takes fixed names, and the person who
#              opened the issue is not known until it exists
#   parent     there is no template key for the sub-issue relationship at all.
#              The task template asks for the parent and the answer lands in
#              the body as text, so the hierarchy on the board stayed empty
#              while the issue itself said who its parent was — and somebody
#              had to drag it into place afterwards.

name: New issue

on:
  issues:
    types: [opened, edited]

permissions:
  # Assigning, and addSubIssue writes to both issues.
  issues: write
  contents: read

jobs:
  assign:
    name: Assign the author
    runs-on: ubuntu-latest
    # Only on creation, and only when nobody is assigned — so that deliberately
    # reassigning an issue is not undone the next time somebody edits it.
    if: github.event.action == 'opened' && !github.event.issue.assignees[0]

    steps:
      - name: Assign whoever opened it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
          REPO: ${{ github.repository }}
        run: |
          # Not fatal if it does not take. GitHub only allows assigning people
          # with push access, so an issue opened by an outside contributor
          # cannot be assigned to them — and that is a normal event, not a
          # broken workflow. Going red on it would train everyone to ignore a
          # red cross on new issues.
          if gh issue edit "$NUMBER" --repo "$REPO" --add-assignee "$AUTHOR"; then
            echo "Assigned #$NUMBER to $AUTHOR"
          else
            echo "::warning::Could not assign #$NUMBER to $AUTHOR — no push access?"
          fi

  link:
    name: Link a task to its parent feature
    runs-on: ubuntu-latest
    # Only tasks have a parent. Guarding here rather than inside keeps a bug or
    # a feature from spending a runner on nothing.
    if: contains(github.event.issue.labels.*.name, 'task')

    steps:
      - name: Find the parent in the body
        id: parent
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          # The first #123 under the "Parent feature" heading. Reading the whole
          # body would find issue references in prose — "the same shape as #130"
          # is a sentence, not a parent.
          number="$(printf '%s' "$BODY" \
            | sed -n '/^###* *Parent feature/,/^###/p' \
            | grep -oE '#[0-9]+' | head -1 | tr -d '#')"

          if [ -z "$number" ]; then
            echo "No parent feature given; nothing to link."
            echo "found=" >> "$GITHUB_OUTPUT"
          else
            echo "Parent is #$number"
            echo "found=$number" >> "$GITHUB_OUTPUT"
          fi

      - name: Link it
        if: steps.parent.outputs.found != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHILD: ${{ github.event.issue.number }}
          PARENT: ${{ steps.parent.outputs.found }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          owner="${REPO%%/*}"
          name="${REPO##*/}"

          ids() {
            gh api graphql \
              -f owner="$owner" -f name="$name" -F number="$1" \
              -f query='query($owner:String!,$name:String!,$number:Int!){
                repository(owner:$owner,name:$name){ issue(number:$number){ id } }
              }' --jq '.data.repository.issue.id'
          }

          parent_id="$(ids "$PARENT")"
          child_id="$(ids "$CHILD")"

          # Idempotent on purpose: this also runs on `edited`, so correcting a
          # typo in the parent number re-runs it, and an unchanged parent must
          # not then fail the workflow. GitHub rejects a duplicate link, which
          # is the expected outcome rather than an error.
          if gh api graphql \
            -f parent="$parent_id" -f child="$child_id" \
            -f query='mutation($parent:ID!,$child:ID!){
              addSubIssue(input:{issueId:$parent, subIssueId:$child}){
                subIssue { number }
              }
            }' >/tmp/result 2>/tmp/error; then
            echo "Linked #$CHILD under #$PARENT"
          elif grep -qiE 'already|duplicate' /tmp/error; then
            echo "#$CHILD is already a sub-issue of #$PARENT"
          else
            cat /tmp/error >&2
            exit 1
          fi
