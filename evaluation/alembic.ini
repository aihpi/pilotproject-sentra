# Alembic, for the eval database only. SENTRA's own state lives in Qdrant and
# has no schema to migrate.
#
#   uv run alembic upgrade head        apply everything
#   uv run alembic revision --autogenerate -m "..."   after changing a model
#
# The database URL is deliberately absent here. env.py reads it from
# EvalSettings, so there is one place saying where the eval database is and it
# is the same one the application uses.

[alembic]
script_location = src/sentra_eval/migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
