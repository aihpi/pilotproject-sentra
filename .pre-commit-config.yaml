# Python only, on purpose. The frontend has its own eslint setup and CI runs it;
# a hook has to be fast and must not require a toolchain the committer may not
# have, so a backend-only change never needs npm and vice versa.
#
#   uv tool install pre-commit     (or pipx install pre-commit)
#   pre-commit install
#   pre-commit run --all-files     to check everything once

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Two or more trailing spaces are a hard line break in markdown, and the
        # PR template relies on them. Without this the hook silently reflows it.
        args: [--markdown-linebreak-ext=md]
        exclude: ^references/
      - id: end-of-file-fixer
        # references/ holds documents we received rather than source we own.
        exclude: ^references/
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      # No check-added-large-files: the PDF corpus is tracked deliberately and
      # five tracked files are already over 1 MB.

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(backend|evaluation)/
      - id: ruff-format
        files: ^(backend|evaluation)/

  # mypy needs each project's own dependencies to resolve imports, so it runs
  # inside that project's uv environment rather than an isolated hook env. Two
  # distributions, two environments — the harness depends on nothing of
  # SENTRA's, which is the point of it being separate.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        types: [python]
        files: ^backend/src/
        pass_filenames: false
      - id: mypy-eval
        name: mypy (evaluation)
        entry: bash -c 'cd evaluation && uv run mypy'
        language: system
        types: [python]
        files: ^evaluation/src/
        pass_filenames: false
      - id: import-linter
        name: import-linter (backend)
        entry: bash -c 'cd backend && uv run lint-imports'
        language: system
        types: [python]
        files: ^backend/src/
        pass_filenames: false
