# Alembic, for the document registry. SENTRA had no SQL schema before #141 —
# the corpus was whatever happened to be in Qdrant.
#
#   uv run alembic upgrade head        apply everything
#   uv run alembic revision --autogenerate -m "..."   after changing a model
#
# The database URL is deliberately absent here. env.py reads it from
# Settings, so there is one place saying where the registry database is and it
# is the same one the application uses.

[alembic]
script_location = src/sentra/migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
