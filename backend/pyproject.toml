[project]
name = "sentra"
version = "0.1.0"
description = "RAG prototype for the German Bundestag Wissenschaftliche Dienste"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.72.0",
    "qdrant-client>=1.19.0",  # keep within one minor of the server image, see docker-compose.yml
    "openai>=1.50.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "langdetect>=1.0.9",
    # Imported directly by our own modules, so declared even though they also
    # arrive transitively. Floors match what the upstream packages already
    # require, except numpy where nothing upstream constrains us.
    "pydantic>=2.7.0",          # api/models.py
    "docling-core>=2.62.0",     # ingestion/parser.py, ContentLayer
    "pypdfium2>=4.30.0",        # ingestion/parser.py
    "numpy>=1.26",              # rag/store.py
]

[project.optional-dependencies]
# The evaluation harness. An extra rather than a base dependency, and a
# dependency group would not do: groups are a development-time concept and do
# not survive into an installed package, whereas this has to be installable
# into the production image on the deployments that run rounds and absent on
# the ones that do not. main imports sentra.evaluation only when EVAL_ENABLED
# is set, which is what makes leaving it out safe.
eval = [
    "httpx>=0.27.0",  # the runner calls SENTRA over HTTP at SENTRA_BASE_URL
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13",
    "import-linter>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F pycodestyle + pyflakes, I import order, UP pyupgrade,
# B bugbear, SIM flake8-simplify
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is a function call in a default argument by
# design, so B008 is a false positive on every route handler.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
# Long assertion messages and the ground-truth table read better unwrapped.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/sentra"]
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
# Makes the deferred ignores below self-cleaning: once the underlying cause is
# fixed, the now-pointless ignore fails the check instead of lingering.
warn_unused_ignores = true
# An unannotated parameter is silently Any, so mypy checks nothing about it and
# says nothing either. Two had been sitting unannotated since before domain/
# existed to name their types, and nothing reported them. On at the cost of
# four annotations.
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Neither ships type information or a py.typed marker.
module = ["langdetect.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires Qdrant + AI Hub with ingested data",
]

[tool.importlinter]
root_package = "sentra"

[[tool.importlinter.contracts]]
# Higher layers may import lower ones, never the reverse.
#
#   "a | b"   siblings that may NOT import each other
#   "(a)"     optional: the contract holds whether or not the module exists
#
# evaluation sits just above domain on purpose. The harness talks to SENTRA over
# HTTP and works from stored responses, so it has no reason to import the system
# under test; putting it here means the layers contract restricts it to domain
# and config on its own, while main is still allowed to import it in order to
# mount its router. The module does not exist yet, hence the parentheses: a
# forbidden-type contract naming a missing module is a hard error, an optional
# layer is not.
name = "Layered architecture"
type = "layers"
containers = ["sentra"]
layers = [
    "main",
    "api",
    "services",
    "rag | ingestion",
    "(evaluation)",
    "domain",
    "config",
]
# Fail if a new top-level module appears and nobody adds it here.
exhaustive = true

[[tool.importlinter.contracts]]
# The harness must not import what it measures.
#
# The layers contract above already makes these imports impossible, so this is
# not what stops them happening. It is here to name the two places where the
# temptation is concrete and to say why each one is a mistake.
#
# rag.generator: the Vorlage asks for a check that shares neither model nor
# prompt structure with SENTRA. Reusing the prompt scaffolding would move a
# consistency problem into the thing measuring it rather than finding it.
#
# api.models: the harness has its own audience and its own response shapes.
# Sharing them is how services/explorer.py came to import from the API layer,
# which is what #18 was for.
name = "The evaluation harness does not import what it measures"
type = "forbidden"
source_modules = ["sentra.evaluation"]
forbidden_modules = ["sentra.rag.generator", "sentra.api.models"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
