services:
  backend:
    build:
      context: ./backend
    ports:
      # host:container. 8000 is uvicorn inside the image, 8001 is the host.
      - "8001:8000"
    env_file:
      # The single source of configuration, shared with local runs and tests.
      - backend/.env
    environment:
      # The three values that differ inside a container. Everything else comes
      # from the file above, so there is no second env file to keep in sync.
      QDRANT_URL: http://qdrant:6333
      DOCUMENTS_DIR: /data/Ausarbeitungen
      FEEDBACK_FILE: /data/feedback.jsonl
      # Points at the service below. Read only when EVAL_ENABLED is set, which
      # it is not by default, so the stack behaves as it always did until
      # somebody turns the harness on — and then needs no further wiring.
      EVAL_DATABASE_URL: postgresql+psycopg://sentra:sentra@eval-db:5432/sentra_eval
    volumes:
      - ./data:/data
    depends_on:
      qdrant:
        condition: service_started
      # Started, not healthy. The backend must come up whether or not the eval
      # database is there: it opens no connection until an eval route is
      # called, and waiting on a dependency the harness may not even be using
      # would make SENTRA's availability depend on the harness's.
      eval-db:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      # host:container. 80 is nginx inside the image, 5173 on the host to match
      # the port the vite dev server uses.
      - "5173:80"
    depends_on:
      - backend

  eval-db:
    # The evaluation harness's database. Postgres rather than SQLite because a
    # round is worked through by Hotline and WD at the same time, on the review
    # screen, and SQLite's single writer is exactly the wrong shape for that.
    #
    # Pinned for the same reason as Qdrant below. Nothing in SENTRA proper
    # touches this: with EVAL_ENABLED unset the backend never connects, and the
    # container simply idles.
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: sentra
      POSTGRES_PASSWORD: sentra
      POSTGRES_DB: sentra_eval
    ports:
      # 5433 on the host. 5432 is very often already taken by a local Postgres,
      # and a port clash here would look like the whole stack failing to start.
      - "5433:5432"
    volumes:
      - eval_db_storage:/var/lib/postgresql/data

  qdrant:
    # Pinned, not :latest. The client enforces a compatibility window of one
    # minor version, so a rolling server tag drifts out of it on its own. Keep
    # this, qdrant-client in backend/pyproject.toml, and
    # k8s/qdrant/deployment.yaml on the same minor.
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
  eval_db_storage:
