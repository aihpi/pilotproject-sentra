# Applies the registry schema, as a plain Job you can run on its own.
#
# The real one is an ArgoCD Sync hook in k8s/registry/migrate-job.yaml, and it
# should not need this. But a hook only runs as part of a sync, so if a sync
# halts before its wave -- the first one did, at the Qdrant failure in wave 0
# -- or if only some resources were synced, the schema is silently never
# applied. Ingestion then fails every file with
#
#   relation "documents" does not exist
#
# which reports as 148 errors rather than as a deployment problem.
#
# This is the same command with no hook semantics and no waves, so it runs
# when you sync it and its log is its own.
#
# RENAMED from run-registry-migration. A Job's pod template is immutable, so
# syncing a corrected spec under a name that already exists cannot change it:
# the old Job stays, its old pod's logs stay, and it looks as though the fix
# did nothing. A new name is the cheapest way to be certain you are reading a
# fresh run. The old Job can be deleted whenever.
#
# This branch is not for merging. Delete the Application once the schema is at
# head.
apiVersion: batch/v1
kind: Job
metadata:
  name: run-registry-migration-2
  labels:
    app: run-registry-migration-2
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: run-registry-migration-2
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          # The tag main currently deploys. Alembic lives in this image, and
          # alembic.ini only since #200 -- an older tag fails with
          # "No 'script_location' key found in configuration".
          image: ghcr.io/aihpi/pilotproject-sentra/backend:sha-ca97c3a
          command:
            - sh
            - -c
            - |
              echo "=== current revision ==="
              uv run --no-dev alembic current || true
              echo
              echo "=== upgrading ==="
              uv run --no-dev alembic upgrade head
              echo
              echo "=== revision after ==="
              uv run --no-dev alembic current
          envFrom:
            - configMapRef:
                name: sentra-backend-config
          env:
            - name: REGISTRY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sentra-secret
                  key: REGISTRY_DATABASE_URL
            # A migration has nothing to do with the AI hub, and needs this
            # anyway: migrations/env.py takes the database URL from Settings so
            # that there is one answer to "where is the registry database", and
            # building Settings validates every field. ai_hub_api_key has no
            # default, so without it alembic dies on a pydantic ValidationError
            # before it opens a connection.
            - name: AI_HUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentra-secret
                  key: AI_HUB_API_KEY
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "100m"
              memory: "256Mi"
